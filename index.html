  at startup) so the game works fully offline and the single file stays within
  the canvas size limit; regenerable with build-bundle.mjs from the jsDelivr
  minified three.core.js + three.module.js builds
  Full license texts are appended as comments at the end of this file.

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ocraft - voxel sandbox</title>
    <style>
:root {
  color-scheme: dark;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body,
#app {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #8fc3ff;
}

canvas {
  display: block;
  cursor: crosshair;
}

.hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  user-select: none;
}

.crosshair {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 20px;
  height: 20px;
  transform: translate(-50%, -50%);
  mix-blend-mode: difference;
}

.crosshair::before,
.crosshair::after {
  content: '';
  position: absolute;
  background: #fff;
}

.crosshair::before {
  top: 50%;
  left: 0;
  width: 100%;
  height: 2px;
  transform: translateY(-50%);
}

.crosshair::after {
  left: 50%;
  top: 0;
  width: 2px;
  height: 100%;
  transform: translateX(-50%);
}

.hotbar {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  padding: 4px;
  background: rgba(0, 0, 0, 0.35);
  border-radius: 6px;
}

.health {
  position: absolute;
  bottom: 86px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 3px;
  font-size: 20px;
  line-height: 1;
  text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.9);
}

.heart.full {
  color: #e23b3b;
}

.heart.half {
  color: #e23b3b;
  opacity: 0.5;
}

.heart.empty {
  color: #2b2b2b;
}

.air {
  position: absolute;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  font-size: 13px;
  line-height: 1;
  color: #9fd8ff;
  text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.9);
}

.air.hidden {
  display: none;
}

/* The menu world is shown bare, with no player indicators over it. */
.hud.title-screen .crosshair,
.hud.title-screen .health,
.hud.title-screen .air,
.hud.title-screen .hotbar {
  display: none;
}

.bubble.empty {
  opacity: 0.15;
}

.damage-flash {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(180, 0, 0, 0) 35%, rgba(180, 0, 0, 0.75) 100%);
  opacity: 0;
}

.damage-flash.active {
  animation: damage-fade 0.45s ease-out;
}

@keyframes damage-fade {
  from {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}

.banner {
  position: absolute;
  top: 38%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 10px 22px;
  font-size: 26px;
  letter-spacing: 2px;
  color: #ffdede;
  background: rgba(90, 0, 0, 0.55);
  border-radius: 8px;
  text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.8);
}

.banner.hidden {
  display: none;
}

.fire {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 120%, rgba(255, 170, 40, 0.85) 0%, rgba(255, 90, 10, 0.4) 35%, rgba(255, 60, 0, 0) 65%),
    radial-gradient(ellipse at center, rgba(255, 70, 0, 0) 45%, rgba(170, 40, 0, 0.5) 100%);
  animation: flicker 0.35s steps(2, end) infinite alternate;
}

.fire.hidden {
  display: none;
}

.sick {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(90, 150, 40, 0) 30%, rgba(74, 128, 32, 0.55) 100%);
  animation: queasy 3.2s ease-in-out infinite alternate;
}

.sick.hidden {
  display: none;
}

.toast {
  position: absolute;
  bottom: 134px;
  left: 50%;
  transform: translateX(-50%);
  padding: 5px 14px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.55);
  font-size: 14px;
  white-space: nowrap;
  color: #ffe9b8;
  text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.9);
  opacity: 0;
}

.toast.active {
  animation: toast-fade 1.6s ease-out;
}

@keyframes toast-fade {
  0%,
  60% {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}

@keyframes queasy {
  from {
    opacity: 0.45;
  }
  to {
    opacity: 0.95;
  }
}

@keyframes flicker {
  from {
    opacity: 0.75;
    transform: scaleY(1);
  }
  to {
    opacity: 1;
    transform: scaleY(1.04);
  }
}

.mining-bar {
  position: absolute;
  top: calc(50% + 24px);
  left: 50%;
  width: 140px;
  height: 6px;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 3px;
  overflow: hidden;
}

.mining-bar.hidden {
  display: none;
}

.mining-bar > div {
  height: 100%;
  width: 0;
  background: #e8e8e8;
}

.inventory {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(8, 14, 24, 0.72);
  backdrop-filter: blur(3px);
  pointer-events: auto;
}

.inventory.hidden {
  display: none;
}

.inv-panel {
  width: min(820px, 94vw);
  max-height: 86vh;
  overflow-y: auto;
  padding: 22px 26px;
  color: #eef2f7;
  background: rgba(16, 22, 34, 0.94);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 10px;
}

.inv-panel h2 {
  margin: 0 0 4px;
  letter-spacing: 1px;
}

.inv-note {
  margin: 0 0 12px;
  font-size: 13px;
  color: #9fd4ff;
}

.inv-section {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 18px 0 8px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
}

.inv-section h3 {
  margin: 0 0 4px;
  font-size: 15px;
  letter-spacing: 0.5px;
}

.inv-section small {
  color: #93a2b4;
  font-size: 12px;
}

.inv-hotbar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.inv-items {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.inv-slot,
.inv-item {
  position: relative;
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
  padding: 0;
  background: rgba(255, 255, 255, 0.06);
  border: 2px solid rgba(255, 255, 255, 0.18);
  border-radius: 5px;
  cursor: pointer;
}

.inv-slot:hover,
.inv-item:hover {
  background: rgba(255, 255, 255, 0.16);
}

.inv-slot.selected {
  border-color: #ffd770;
  box-shadow: 0 0 0 2px rgba(255, 215, 112, 0.3);
}

.inv-item.equipped {
  border-color: rgba(143, 211, 255, 0.8);
}

.inv-slot canvas,
.inv-item canvas {
  image-rendering: pixelated;
}

.inv-count {
  position: absolute;
  right: 3px;
  bottom: 1px;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  text-shadow: 1px 1px 0 #000;
}

.inv-key {
  position: absolute;
  top: 1px;
  left: 4px;
  font-size: 10px;
  color: rgba(255, 255, 255, 0.7);
  text-shadow: 1px 1px 0 #000;
}

.inv-empty {
  margin: 0;
  font-size: 13px;
  color: #93a2b4;
}

.recipe-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
}

.recipe {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  font: inherit;
  text-align: left;
  color: inherit;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 6px;
  cursor: pointer;
}

.recipe:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.14);
}

.recipe:disabled {
  opacity: 0.4;
  cursor: default;
}

.recipe.locked {
  border-style: dashed;
}

.recipe canvas {
  image-rendering: pixelated;
  flex: 0 0 auto;
}

.recipe-text {
  display: flex;
  flex-direction: column;
  line-height: 1.35;
}

.recipe-text small {
  color: #a9b7c6;
  font-size: 12px;
}

.inv-close {
  margin-top: 18px;
  padding: 8px 16px;
  font: inherit;
  color: #eef2f7;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 6px;
  cursor: pointer;
}

.slot {
  position: relative;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border: 2px solid rgba(255, 255, 255, 0.25);
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.3);
}

.slot canvas {
  image-rendering: pixelated;
  width: 40px;
  height: 40px;
}

.slot.selected {
  border-color: #fff;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35);
}

.slot-key {
  position: absolute;
  top: 1px;
  left: 4px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.75);
  text-shadow: 1px 1px 0 #000;
}

.slot-count {
  position: absolute;
  right: 3px;
  bottom: 1px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  text-shadow: 1px 1px 0 #000;
}

.slot.empty canvas {
  opacity: 0.3;
}

.debug {
  position: absolute;
  top: 10px;
  left: 12px;
  font-size: 13px;
  font-family: 'Cascadia Mono', Consolas, monospace;
  color: #fff;
  text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.8);
}

.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(8, 14, 24, 0.6);
  backdrop-filter: blur(3px);
  pointer-events: auto;
  cursor: pointer;
}

.overlay.hidden {
  display: none;
}

.panel {
  width: min(980px, 96vw);
  padding: 28px 34px;
  text-align: center;
  color: #f2f5f8;
  background: rgba(16, 22, 34, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 10px;
}

.panel h1 {
  margin: 0 0 6px;
  font-size: 30px;
  letter-spacing: 1px;
}

.panel .hint {
  margin: 0 0 18px;
  color: #9fd4ff;
}

.difficulty {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 20px;
}

.difficulty-btn {
  display: flex;
  flex-direction: column;
  gap: 3px;
  width: 200px;
  padding: 10px 12px;
  font: inherit;
  color: #eef2f7;
  background: rgba(255, 255, 255, 0.07);
  border: 2px solid rgba(255, 255, 255, 0.18);
  border-radius: 7px;
  cursor: pointer;
}

.difficulty-btn:hover {
  background: rgba(255, 255, 255, 0.16);
}

.difficulty-btn.active {
  border-color: #ffd770;
  background: rgba(255, 215, 112, 0.16);
}

.difficulty-btn.controls-btn {
  width: 200px;
  border-style: dashed;
}

.difficulty-btn.play-btn {
  width: 260px;
  border-style: solid;
  border-color: #7bd67b;
  background: rgba(94, 190, 94, 0.22);
}

.difficulty-btn.play-btn b {
  color: #b9f2b9;
}

.controls-row {
  display: flex;
  justify-content: center;
}

.controls-overlay {
  background: rgba(8, 14, 24, 0.75);
  cursor: default;
}

.controls-overlay .panel {
  width: min(880px, 94vw);
}

.controls-overlay h1 {
  margin-bottom: 14px;
  font-size: 24px;
}

.difficulty-btn b {
  font-size: 16px;
  letter-spacing: 0.5px;
}

.difficulty-btn small {
  font-size: 11px;
  line-height: 1.3;
  color: #b7c4d3;
}

.panel ul {
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 14px;
  line-height: 1.9;
  color: #c9d4e0;
}

.panel .warn {
  margin-top: 8px;
  color: #ffb4a0;
}

.trade-panel {
  width: min(520px, 94vw);
}

.trade-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.trade {
  display: grid;
  grid-template-columns: 1fr auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  font: inherit;
  color: inherit;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 6px;
  cursor: pointer;
}

.trade:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.14);
}

.trade:disabled {
  opacity: 0.45;
  cursor: default;
}

.trade.sold-out {
  border-style: dashed;
}

.trade-side {
  display: flex;
  gap: 6px;
}

.trade-stack {
  position: relative;
  display: grid;
  place-items: center;
}

.trade-stack canvas {
  image-rendering: pixelated;
}

.trade-arrow {
  color: #9fd4ff;
  font-size: 18px;
}

.trade-status {
  color: #a9b7c6;
  font-size: 12px;
  text-align: right;
}
    </style>
  </head>

/** Scans the world around the player for the nearest ore Verity can fetch. */
function findOreForVerity(wanted) {
    const ores = wanted === null
        ? [Block.DiamondOre, Block.EmeraldOre, Block.GoldOre, Block.IronOre,
            Block.CopperOre, Block.CoalOre, Block.LuckyBlock]
        : [wanted];
    const range = 20;
    const px = Math.floor(player.position.x);
    const py = Math.floor(player.position.y);
    const pz = Math.floor(player.position.z);
    let best = null;
    for (let x = px - range; x <= px + range; x++) {
        for (let z = pz - range; z <= pz + range; z++) {
            for (let y = Math.max(1, py - 12); y <= Math.min(120, py + 12); y++) {
                const id = world.getBlock(x, y, z);
                if (!ores.includes(id))
                    continue;
                const dx = x + 0.5 - player.position.x;
                const dy = y + 0.5 - player.position.y;
                const dz = z + 0.5 - player.position.z;
                const d = dx * dx + dy * dy + dz * dz;
                if (!best || d < best.d)
                    best = { pos: new THREE.Vector3(x + 0.5, y + 0.5, z + 0.5), id, d };
            }
        }
    }
    return best;
}

/** Dry land with headroom; the cheap height test runs first so few chunks are generated. */
function findSpawn() {
    if (new URLSearchParams(window.location.search).get('spawnpoint') === 'village') {
        const village = findVillageSpawn();
        if (village)
            return village;
    }
    for (let attempt = 0; attempt < SPAWN_ATTEMPTS; attempt++) {
        const x = Math.floor((Math.random() * 2 - 1) * SPAWN_RANGE);
        const z = Math.floor((Math.random() * 2 - 1) * SPAWN_RANGE);
        const height = terrainHeight(x, z);
        if (height <= SEA_LEVEL + 1)
            continue;
        const ground = world.getBlock(x, height, z);
        if (isLava(ground) || !world.isSolidAt(x, height, z))
            continue;
        if (world.getBlock(x, height + 1, z) !== Block.Air)
            continue;
        if (world.getBlock(x, height + 2, z) !== Block.Air)
            continue;
        return new THREE.Vector3(x + 0.5, height + 1, z + 0.5);
    }
    return new THREE.Vector3(8.5, Math.max(terrainHeight(8, 8), SEA_LEVEL) + 2, 8.5);
}
/** A standable spot on the outskirts of the village nearest a random column. */
function findVillageSpawn() {
    const x = Math.floor((Math.random() * 2 - 1) * SPAWN_RANGE);
    const z = Math.floor((Math.random() * 2 - 1) * SPAWN_RANGE);
    const site = nearestVillage(x, z, VILLAGE_SEARCH_RINGS);
    if (!site)
        return null;
    for (const [dx, dz] of VILLAGE_SPAWN_OFFSETS) {
        const spot = standingSpot(site.centerX + dx, site.centerZ + dz, site.level);
        if (spot)
            return spot;
    }
    return null;
}
/**
 * The surface of a column near a known ground level. Villages flatten the land
 * they sit on, so the generated terrain height is no guide there.
 */
function standingSpot(x, z, level) {
    for (let y = level + 6; y > level - 8; y--) {
        if (!world.isSolidAt(x, y, z))
            continue;
        if (isLava(world.getBlock(x, y, z)))
            return null;
        if (world.getBlock(x, y + 1, z) !== Block.Air || world.getBlock(x, y + 2, z) !== Block.Air)
            return null;
        return new THREE.Vector3(x + 0.5, y + 1, z + 0.5);
    }
    return null;
}

// Furnace recipes: each ore cooks into its refined material, one coal per ore.
const SMELTING = new Map([
    [Block.IronOre, Item.IronIngot],
    [Block.CopperOre, Item.CopperIngot],
    [Block.DiamondOre, Item.Diamond],
    [Block.EmeraldOre, Item.Emerald],
]);
function smeltAtFurnace() {
    const batches = [];
    for (const [id, count] of inventory.entries()) {
        const output = SMELTING.get(id);
        if (output !== undefined)
            batches.push({ id, count, output });
    }
    if (batches.length === 0) {
        hud.showToast('Nothing to smelt \u2014 bring ores to the furnace');
        return;
    }
    const totalOre = batches.reduce((sum, batch) => sum + batch.count, 0);
    const coal = inventory.count(Item.Coal);
    if (coal === 0) {
        hud.showToast(`The furnace needs coal \u2014 ${totalOre} ore ready`);
        return;
    }
    let fuel = coal;
    let smelted = 0;
    for (const batch of batches) {
        const n = Math.min(batch.count, fuel);
        if (n <= 0)
            break;
        inventory.take(batch.id, n);
        inventory.add(batch.output, n);
        fuel -= n;
        smelted += n;
    }
    inventory.take(Item.Coal, smelted);
    audio.playPickup();
    hud.showToast(`Furnace: smelted ${smelted} ore with ${smelted} coal`);
    refreshHotbar();
}

/** Stone speckled with ore blobs. */
function paintOre(ctx, tile, color, rand) {
    const [ox, oy] = tileOrigin(tile);
    const stone = [128, 128, 128];
    for (let y = 0; y < TILE_PX; y++) {
        for (let x = 0; x < TILE_PX; x++) {
            px(ctx, ox + x, oy + y, shade(stone, (rand() * 2 - 1) * 16));
        }
    }
    for (let blob = 0; blob < 5; blob++) {
        const bx = 2 + Math.floor(rand() * 12);
        const by = 2 + Math.floor(rand() * 12);
        const radius = 1 + Math.floor(rand() * 2);
        for (let dy = -radius; dy <= radius; dy++) {
            for (let dx = -radius; dx <= radius; dx++) {
                if (dx * dx + dy * dy > radius * radius + 1)
                    continue;
                const x = bx + dx;
                const y = by + dy;
                if (x < 0 || y < 0 || x >= TILE_PX || y >= TILE_PX)
                    continue;
                px(ctx, ox + x, oy + y, shade(color, (rand() * 2 - 1) * 18));
            }
        }
    }
}

/** Thin stalks topped with grain, on a transparent background. */
function paintWheat(ctx, tile, stage, rand) {
    const [ox, oy] = tileOrigin(tile);
    const ripe = stage === 3;
    const grain = ripe ? [222, 196, 86] : [138, 180, 78];
    const husk = ripe ? [176, 146, 52] : [104, 156, 62];
    const stem = ripe ? [150, 150, 70] : [86, 140, 58];
    // Young crops are short, so the rows above the sprout stay transparent.
    const base = [11, 7, 3, 1][stage];
    for (let i = 0; i < 4; i++) {
        const column = 1 + i * 4;
        const top = base + (i % 2);
        const earEnd = Math.min(TILE_PX - 1, top + 8);
        for (let y = top; y < TILE_PX; y++) {
            px(ctx, ox + column, oy + y, shade(y < earEnd ? husk : stem, (rand() * 2 - 1) * 10));
        }
        // Grain hangs off alternating sides of the stalk.
        for (let y = top + 1; y < earEnd; y += 2) {
            px(ctx, ox + column - 1, oy + y, shade(grain, (rand() * 2 - 1) * 12));
            px(ctx, ox + column + 1, oy + y + 1, shade(grain, (rand() * 2 - 1) * 12));
        }
    }
}

    const blade = [92, 158, 62];
    for (let x = 1; x < TILE_PX - 1; x++) {

            const fade = ((y - top) / (TILE_PX - top)) * 18 - 12;
            px(ctx, ox + x, oy + y, shade(blade, fade + (rand() * 2 - 1) * 12));
        }
    }
}
